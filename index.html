<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Am I Being Scammed?</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 40px 10px; }
        .card { background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 120px; padding: 10px; border: 2px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { background: #0056b3; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        #resultBox { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; }
        .high-risk { background: #ffe6e6; border: 2px solid #d9534f; color: #900; }
        .low-risk { background: #fff3cd; border: 2px solid #ffebaa; color: #856404; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🛡️ Am I Being Scammed?</h2>
        <p>Paste suspicious text below:</p>
        <textarea id="userInput" placeholder="Paste message here..."></textarea>
        <button type="button" id="checkBtn">Check for Scams</button>

        <div id="resultBox">
            <h3 id="riskLevel"></h3>
            <p id="riskExplanation"></p>
            <ul id="redFlagsList"></ul>
        </div>
    </div>

    <script>
        document.getElementById('checkBtn').addEventListener('click', function() {
    const input = document.getElementById('userInput').value.trim();
    const resultBox = document.getElementById('resultBox');
    const riskLevel = document.getElementById('riskLevel');
    const riskExplanation = document.getElementById('riskExplanation');
    const redFlagsList = document.getElementById('redFlagsList');

    if (!input) {
        alert("Please paste text first!");
        return;
    }

    redFlagsList.innerHTML = "";
    let score = 0;
    let flags = [];

    // Category 1: Upfront Payments & Job Fees
    if (/fee|registration|3200|payment|advance|charge|शुल्क|पैसा|कमिसन/i.test(input)) {
        score += 3;
        flags.push("Demands upfront payment or registration fee.");
    }

    // Category 2: Lottery, Prize & Free Money Scams
    if (/won|winner|lottery|prize|lakh|crore|congratulations|gift|पुरस्कार|चिठ्ठा|जीत/i.test(input)) {
        score += 3;
        flags.push("Claims you won a lottery, prize, or cash gift unexpectedly.");
    }

    // Category 3: Banking, OTP, Account Blocking & Suspicious Links
    if (/otp|pin|password|bank|account|blocked|verify|click here|link|bit\.ly|t\.me|khalti|esewa|पासवर्ड/i.test(input)) {
        score += 3;
        flags.push("Requests sensitive banking info, OTP, or includes suspicious links.");
    }

    // Category 4: High-Yield Investment / Easy Income
    if (/100%|genuine|guarantee|earn daily|double your money|crypto|invest|गारन्टी|ग्यारेन्टी|अन्लाईन कमाई/i.test(input)) {
        score += 2;
        flags.push("Promises guaranteed high income or 100% risk-free earnings.");
    }

    // Category 5: Work-From-Home / Data Entry / Typing Traps
    if (/typing|data entry|screen|part time|work from home|घर\/अफिस|घरमै/i.test(input)) {
        score += 2;
        flags.push("Offers low-effort work-from-home or online typing jobs.");
    }

    // Category 6: Artificial Urgency & Threats
    if (/urgent|immediately|within 24 hours|legal action|police|अहिले नै|तत्काल/i.test(input)) {
        score += 2;
        flags.push("Uses artificial urgency or legal threats to force immediate action.");
    }

    resultBox.style.display = "block";

    // Scoring Threshold
    if (score >= 3) {
        resultBox.className = "high-risk";
        riskLevel.innerText = "🚨 HIGH RISK SCAM DETECTED";
        riskExplanation.innerText = "This message contains strong scam indicators:";
    } else if (score > 0) {
        resultBox.className = "low-risk";
        riskLevel.innerText = "⚠️ MODERATE CAUTION";
        riskExplanation.innerText = "Some suspicious patterns detected. Proceed carefully:";
    } else {
        resultBox.className = "low-risk";
        riskLevel.innerText = "✅ SAFE / LOW RISK";
        riskExplanation.innerText = "No common scam keywords detected in this text.";
        flags.push("No registration fees, fake prizes, or suspicious requests found.");
    }

    flags.forEach(f => {
        let li = document.createElement('li');
        li.innerText = f;
        redFlagsList.appendChild(li);
    });
});
    </script>
</body>
</html>
